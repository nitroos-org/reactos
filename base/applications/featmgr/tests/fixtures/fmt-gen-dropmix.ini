[Feature]
Id=fmt-gen-dropmix
Name=FmGen DropMix
Description=Test fixture: catalog compat: good items stay in the record, refused ones (Classes\.txt, exefile, .., device name, 2-level key) are dropped
Tier=software
Version=1.0
Dependencies=

[Install]
Provider=native

[Rapps]
Installer=Generate
Scope=User

[Source]
Artifact=https://example.invalid/fmgen.zip
ArtifactSHA1=0000000000000000000000000000000000000000
SizeBytes=100

[Generate]
Files=*.*
Dir=FmGenDropMix
Lnk=!
DelFile=..\..\x|junk.txt|C:\fmgen-abs.txt
DelDir=sub|NUL|..\up
DelReg=HKCU\Software\Classes\.txt|HKCU\Software\Classes\exefile|HKCU\Software\FmGenVend\FmGenMix|HKCU\Software\FmGenTwo
DelRegEmpty=HKCU\Software\FmGenVend|HKCU\Software\FmGenVend\Empty
