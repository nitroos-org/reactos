[Feature]
Id=fmt-hookrel
Name=FEATMGMT test: a hook whose program is not given by its full path
Description=Test fixture (hooks.cmd). Not shipped in the image. Enable must fail before the hook runs.
Tier=os
Version=1.0
Dependencies=

[Payload]
File0=fmt-hook.cmd|%SystemRoot%\Featmgr\fmt-hookrel.out

[Hooks]
Enable=cmd.exe /c echo ran> %SystemRoot%\Featmgr\fmt-hookrel.log
