; test component list for the component-provider tests (selected with FEATMGR_COMPONENTS)
; a small pinned file over https (the Scoop installer script of scoop.ini, commit 1e2f334): the download, the SHA-256
; check and the install line are the real code paths, without a 116 MB file
[fmt-comp]
Name=FEATMGMT test component
Url=https://raw.githubusercontent.com/ScoopInstaller/Install/1e2f334083d609986d8c8bc9e31ae8e87c39fab4/install.ps1
Sha256=94f983b190438311e006b957db7c8422709e0ba62a6c2ac04e278164108f2512
FileName=fmt-comp.ps1
Arch=x86,amd64
DetectFile=%SystemRoot%\Featmgr\fmt-comp.out
Install=cmd.exe /c copy /y %FILE% %SystemRoot%\Featmgr\fmt-comp.out
Uninstall=cmd.exe /c del /q %SystemRoot%\Featmgr\fmt-comp.out

[fmt-compbad]
Name=FEATMGMT test component with a wrong SHA-256
Url=https://raw.githubusercontent.com/ScoopInstaller/Install/1e2f334083d609986d8c8bc9e31ae8e87c39fab4/install.ps1
Sha256=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
FileName=fmt-compbad.ps1
DetectFile=%SystemRoot%\Featmgr\fmt-compbad.out
Install=cmd.exe /c copy /y %FILE% %SystemRoot%\Featmgr\fmt-compbad.out

[fmt-comphttp]
Name=FEATMGMT test component with a plain http address
Url=http://example.invalid/x.exe
Sha256=94f983b190438311e006b957db7c8422709e0ba62a6c2ac04e278164108f2512
DetectFile=%SystemRoot%\Featmgr\fmt-comphttp.out
Install=cmd.exe /c exit 0

[fmt-compnosha]
Name=FEATMGMT test component without a checksum
Url=https://raw.githubusercontent.com/ScoopInstaller/Install/1e2f334083d609986d8c8bc9e31ae8e87c39fab4/install.ps1
DetectFile=%SystemRoot%\Featmgr\fmt-compnosha.out
Install=cmd.exe /c exit 0

[fmt-compreg]
Name=FEATMGMT test component detected by a registry rule
Url=https://raw.githubusercontent.com/ScoopInstaller/Install/1e2f334083d609986d8c8bc9e31ae8e87c39fab4/install.ps1
Sha256=94f983b190438311e006b957db7c8422709e0ba62a6c2ac04e278164108f2512
DetectReg=HKLM\SOFTWARE\ReactOS\Nitro\FmTest|CompDetect|>=5
Install=cmd.exe /c exit 0

[fmt-compghost]
; the installer exits 0 but installs nothing (a Windows Installer package whose custom action could not start): the install
; must fail, because the detect rule does not hold afterwards, and the component stays NotInstalled
Name=FEATMGMT test component (exit 0, nothing installed)
Url=https://raw.githubusercontent.com/ScoopInstaller/Install/1e2f334083d609986d8c8bc9e31ae8e87c39fab4/install.ps1
Sha256=94f983b190438311e006b957db7c8422709e0ba62a6c2ac04e278164108f2512
FileName=fmt-compghost.ps1
DetectFile=%SystemRoot%\Featmgr\fmt-compghost.out
Install=cmd.exe /c exit 0

[fmt-compghostreboot]
; exit 3010 (restart needed) with the detect rule not yet true: counts as done (the files can appear at the restart)
Name=FEATMGMT test component (restart needed, rule not yet true)
Url=https://raw.githubusercontent.com/ScoopInstaller/Install/1e2f334083d609986d8c8bc9e31ae8e87c39fab4/install.ps1
Sha256=94f983b190438311e006b957db7c8422709e0ba62a6c2ac04e278164108f2512
FileName=fmt-compghostreboot.ps1
DetectFile=%SystemRoot%\Featmgr\fmt-compghostreboot.out
Install=cmd.exe /c exit 3010

[fmt-compbig]
; a 1 GiB test file: only for the cancel test (the download is stopped long before the end; its checksum is never reached)
Name=FEATMGMT test component (large download, cancel test)
Url=https://proof.ovh.net/files/1Gb.dat
Sha256=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
SizeBytes=1073741824
FileName=fmt-compbig.bin
DetectFile=%SystemRoot%\Featmgr\fmt-compbig.out
Install=cmd.exe /c exit 0

[fmt-compdisk]
; declares a 10 GiB download: the disk-space check refuses it before anything is downloaded (the error window)
Name=FEATMGMT test component (disk space)
Url=https://proof.ovh.net/files/10Gb.dat
Sha256=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
SizeBytes=10737418240
FileName=fmt-compdisk.bin
DetectFile=%SystemRoot%\Featmgr\fmt-compdisk.out
Install=cmd.exe /c exit 0

[fmt-compreboot]
; the installer asks for a restart (exit code 3010): the window must offer "Restart now" and the install counts as done
Name=FEATMGMT test component (restart needed)
Url=https://raw.githubusercontent.com/ScoopInstaller/Install/1e2f334083d609986d8c8bc9e31ae8e87c39fab4/install.ps1
Sha256=94f983b190438311e006b957db7c8422709e0ba62a6c2ac04e278164108f2512
FileName=fmt-compreboot.ps1
Install=cmd.exe /c exit 3010

; multi-package components (Also=): package A, then package B; B of fmt-compchainbad has a wrong SHA-256 (A must be rolled back)
[fmt-compchain]
Name=FEATMGMT test chain, package A
Url=https://raw.githubusercontent.com/ScoopInstaller/Install/1e2f334083d609986d8c8bc9e31ae8e87c39fab4/install.ps1
Sha256=94f983b190438311e006b957db7c8422709e0ba62a6c2ac04e278164108f2512
FileName=fmt-chainA.ps1
DetectFile=%SystemRoot%\Featmgr\fmt-chainA.out
Install=cmd.exe /c copy /y %FILE% %SystemRoot%\Featmgr\fmt-chainA.out
Uninstall=cmd.exe /c del /q %SystemRoot%\Featmgr\fmt-chainA.out
Also=fmt-compchain-b

