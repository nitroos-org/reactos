[Feature]
Id=fmt-gen-progid
Name=FmGen ProgId
Description=Test fixture: DelReg of the app own per-user ProgID (HKCU\SOFTWARE\Classes\<App.Name.1>, as the Sysinternals entries)
Tier=software
Version=1.0
Dependencies=

[Install]
Provider=native

[Rapps]
Installer=Generate
Scope=User

[Source]
Artifact=https://example.invalid/fmgen.zip
ArtifactSHA1=0000000000000000000000000000000000000000
SizeBytes=100

[Generate]
Files=*.*
Dir=FmGenProgId
Lnk=!
DelReg = HKCU\SOFTWARE\Classes\FmGen.Logfile.1
