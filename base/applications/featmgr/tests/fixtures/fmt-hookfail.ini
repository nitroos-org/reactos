[Feature]
Id=fmt-hookfail
Name=FEATMGMT test: failing Enable hook
Description=Test fixture (hooks.cmd): Enable exits with 3, so the feature must be rolled back and Disable run once. Not shipped in the image.
Tier=os
Version=1.0
Dependencies=

[Payload]
File0=fmt-hook.cmd|%SystemRoot%\Featmgr\fmt-hookfail.out

[Registry]
Reg0=HKLM|SOFTWARE\ReactOS\Nitro\FmTest|HookFail|REG_SZ|1

[Service]
Svc0=FmtHookFail|win32|demand|"%SystemRoot%\system32\cmd.exe"|FmtHookFail test service|0|

[Hooks]
Enable="%SystemRoot%\system32\cmd.exe" /c exit 3
Disable="%SystemRoot%\system32\cmd.exe" /c echo ran> %SystemRoot%\Featmgr\fmt-hookfail.log
