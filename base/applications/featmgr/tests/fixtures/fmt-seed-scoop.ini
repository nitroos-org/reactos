[Feature]
Id=scoop
Name=FEATMGMT test stand-in for the scoop feature (seed test)
Description=Test fixture: replaces the catalog's scoop entry for scoopdefaults.cmd; installing it runs fmt-seed-setup.cmd, which makes the fake Scoop root look installed.
Tier=software
Version=1.0
Dependencies=

[Install]
Provider=command
Installer=fmt-seed-setup.cmd
SilentArgs=
UninstallCmd=cmd.exe /c del /q "%SCOOPROOT%\shims\scoop.cmd"
DetectPath=%SCOOPROOT%\shims\scoop.cmd

[Source]
Artifact=https://example.invalid/fmt-seed-scoop.exe
ArtifactSHA1=0000000000000000000000000000000000000000
