[Feature]
Id=fmt-hook
Name=FEATMGMT test: service account and hooks
Description=Test fixture (hooks.cmd). Not shipped in the image.
Tier=os
Version=1.0
Dependencies=

[Payload]
File0=fmt-hook.cmd|%SystemRoot%\Featmgr\fmt-hook.cmd

[Service]
Svc0=FmtHookSvc|win32|demand|"%SystemRoot%\system32\cmd.exe"|FmtHook test service|0|NT AUTHORITY\LocalService

[Hooks]
; a value that both begins and ends with a double quote has them stripped by GetPrivateProfileString: keep one of the ends unquoted
Enable="%SystemRoot%\system32\cmd.exe" /c %SystemRoot%\Featmgr\fmt-hook.cmd enable
Disable="%SystemRoot%\system32\cmd.exe" /c %SystemRoot%\Featmgr\fmt-hook.cmd disable
