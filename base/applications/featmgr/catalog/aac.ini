[Feature]
Id=aac
Name=AAC audio decoder (AAC-LC, HE-AAC, HE-AAC v2)
Description=Lets Firefox and other Media Foundation programs play AAC audio (the audio of most MP4 videos), including HE-AAC and HE-AAC v2 (low-bitrate streams and podcasts): installs a Media Foundation decoder (the AAC decoder CLSID) built from FFmpeg's native aac decoder, unmodified. 64-bit and 32-bit. Replaces the AAC-LC-only add-on (aac-lc) if that is on. Downloaded when turned on (about 1.5 MB, SHA-256 checked); a patent notice is shown first. Turning it off removes it again; videos with AAC audio then stop playing.
Tier=os
; Full AAC (LC + HE-AAC + HE-AAC v2). Same files, CLSID and registry keys as the AAC-LC-only add-on aac-lc: Replaces=aac-lc turns that one off first
; (featmgr removes its files/keys, or restores what it backed up), and aac-lc has Conflicts=aac (it refuses to turn on while aac is on).
; An optional, removable add-on, NOT in the image: the files are downloaded when it is turned on ([Download]); turning it off removes the files
; and the registry entries again. Source offer, licence texts and the patent notice: nitro-aacdec (dll/3rdparty/nitro-aacdec, AAC_VARIANT=full).
Removable=1
Version=9.0.2
Replaces=aac-lc
Group=Media
Dependencies=
Notice=This add-on installs an AAC audio decoder built from FFmpeg (LGPL-2.1-or-later). It decodes AAC-LC, HE-AAC (SBR) and HE-AAC v2 (PS). If the AAC-LC-only add-on is on, it is replaced.\n\nAAC, including HE-AAC and HE-AAC v2, is covered by patents in some countries (the Via Licensing AAC pool). NitroOS and the FFmpeg licence grant no patent licence. Many core AAC-LC patents are reported to have expired; the HE-AAC and HE-AAC v2 tools came later, so the position for them may differ. Whether you need a licence depends on your country and use; this is not legal advice. You can turn this feature off at any time, or use the smaller AAC-LC-only add-on instead.\n\nLicence texts and the source offer are installed in %SystemRoot%\System32\aac-licenses.

; Hosted payload (engine.c, "hosted payloads"). HKLM\SOFTWARE\ReactOS\Nitro\Featmgr, value PayloadBaseUrl (REG_SZ), overrides BaseUrl.
; The files are produced by tools/stage-aac-lc-payload.sh with AAC_VARIANT=full (it builds them with dll/3rdparty/nitro-aacdec/build-aacdec.sh and checks the pins below).
