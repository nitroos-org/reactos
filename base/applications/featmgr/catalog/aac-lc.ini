[Feature]
Id=aac-lc
Name=AAC audio decoder (AAC-LC)
Description=Lets Firefox and other Media Foundation programs play AAC-LC audio (the audio of most MP4 videos): installs a Media Foundation decoder (the AAC decoder CLSID) built from FFmpeg's native aac decoder, AAC-LC only (no HE-AAC/HE-AAC v2). 64-bit and 32-bit. Downloaded when turned on (about 1.4 MB, SHA-256 checked); a patent notice is shown first. Turning it off removes it again; videos with AAC audio then stop playing, as before.
Tier=os
; An optional, removable add-on, NOT in the image: the files are downloaded when it is turned on ([Download]); turning it off removes the files
; and the registry entries again. Source offer, licence texts and the patent notice: nitro-aacdec (dll/3rdparty/nitro-aacdec).
Removable=1
Version=9.0.2
Conflicts=aac
Group=Media
Dependencies=
Notice=This add-on installs an AAC-LC audio decoder built from FFmpeg (LGPL-2.1-or-later). It decodes AAC-LC only: HE-AAC (SBR) and HE-AAC v2 (PS) are not included.\n\nAAC is covered by patents in some countries (the Via Licensing AAC pool). NitroOS and the FFmpeg licence grant no patent licence. Many core AAC-LC patents are reported to have expired, but whether you need a licence depends on your country and use; this is not legal advice. You can turn this feature off at any time.\n\nLicence texts and the source offer are installed in %SystemRoot%\System32\aac-lc-licenses.

; Hosted payload (engine.c, "hosted payloads"). HKLM\SOFTWARE\ReactOS\Nitro\Featmgr, value PayloadBaseUrl (REG_SZ), overrides BaseUrl.
; The files are produced by tools/stage-aac-lc-payload.sh (it builds them with dll/3rdparty/nitro-aacdec/build-aacdec.sh and checks the pins below).
