[Feature]
Id=claude-desktop
Name=Claude Desktop
Description=Anthropic's Claude desktop app (Electron/Chromium, runs with the Chromium sandbox on). Install downloads Anthropic's official release package (about 250 MB, SHA1-checked) to %ProgramFiles%\Claude, adds the Start-menu shortcut, registers the claude:// sign-in callback machine-wide (needed before the first run) and sets the per-app Direct3D option that lets Chromium paint on nitro. Disable removes the app and reverts the registry changes. amd64 only.
Tier=software
Version=4.29.0
Group=Applications
Dependencies=

[Install]
Provider=native

[Rapps]
; Installer=Generate: featmgr unpacks the package (a Squirrel .nupkg, a zip: the app files are in lib\net45\ and run as-is, no
; Squirrel Update.exe needed), moves the [Generate] Files into the install directory, writes the Add/Remove Programs record
; and the Start-menu shortcut. UninstallName: the installed app's name, used for the uninstall.
Installer=Generate
Scope=Machine
UninstallName=Claude Desktop

[Generate]
; claude.exe first: the first file installed becomes the Start-menu shortcut target
Files=lib\net45\claude.exe|lib\net45\*.*
Dir=%ProgramFiles%\Claude
Icon=claude.exe
Lnk=Claude.lnk

; The package is NOT in the source tree or the image: featmgr downloads it from Anthropic's own
; release feed at install time and verifies the SHA1 below (Anthropic publishes SHA1 in its RELEASES file).
; Newer releases: https://downloads.claude.ai/releases/win32/x64/RELEASES
; Version bump (manual, no auto-discovery): take the new line from RELEASES
; (<SHA1> <file> <size>) and change, here: Version=, Artifact= (file name), ArtifactSHA1=,
; SizeBytes=; then re-run the featmgr roundtrip/live install test.
[Source]
Artifact=https://downloads.claude.ai/releases/win32/x64/AnthropicClaude-4.29.0-full.nupkg
ArtifactSHA1=5ce2f51c0b197d31ccad5b9e1ec0f269c081aa4e
SizeBytes=248346017
Arch=amd64
Publisher=Anthropic
URLSite=https://claude.ai/download
License=Proprietary (Anthropic). Not redistributed by ReactOS-Nitro: downloaded from Anthropic at install time; use is subject to Anthropic's terms.

; Applied after a successful install, reverted on disable/uninstall.
[Registry]
; claude:// OAuth callback. Electron only registers it itself on its first run (per user);
; the Squirrel installer normally does it at install time. Machine-wide, so that
; "start claude://..." works before the first run and for every user.
Reg0=HKLM|SOFTWARE\Classes\claude|@|REG_SZ|URL:claude
Reg1=HKLM|SOFTWARE\Classes\claude|URL Protocol|REG_SZ|
Reg2=HKLM|SOFTWARE\Classes\claude\DefaultIcon|@|REG_SZ|"%ProgramFiles%\Claude\claude.exe",0
Reg3=HKLM|SOFTWARE\Classes\claude\shell\open\command|@|REG_SZ|"%ProgramFiles%\Claude\claude.exe" "%1"
