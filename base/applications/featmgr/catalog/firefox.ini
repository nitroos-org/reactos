[Feature]
Id=firefox
Name=Mozilla Firefox
Description=Mozilla Firefox, the web browser NitroOS opens links with. Installed at first boot on amd64 (with PowerShell 7 and .NET Framework 4.8) when the network is up; on i386 it is installed on request (Optional Features, or Install= in the answer file) and needs a processor with SSE2: Install downloads the official MSI for this architecture from Mozilla (x64 about 90 MiB, x86 about 80 MiB, SHA-256 checked) and runs it silently, then registers Firefox as the default browser for http, https, .htm and .html, writes the Mozilla enterprise policy that stops the default-browser and first-run prompts, and puts Firefox on the desktop and in the Start menu in place of the Internet Explorer entry (Internet Explorer itself stays installed). Turning it off runs the MSI's own uninstaller and gives the default back to Internet Explorer.
Tier=software
Version=159.0.1
Group=Internet
Dependencies=

[Install]
Provider=component
; The recipe is the [firefox] section of %SystemRoot%\Featmgr\Catalog\components.ini, shared with the first-boot installer.
; featmgr downloads the MSI from Mozilla at install time, refuses it unless the SHA-256 matches, and never bundles it.
[Source]
Publisher=Mozilla Foundation
URLSite=https://www.mozilla.org/firefox/
License=MPL-2.0 (Firefox). Not redistributed by ReactOS-Nitro: the unmodified official MSI (x64 or x86) is downloaded from Mozilla at install time.
