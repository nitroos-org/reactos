[Feature]
Id=lavapipe-pack
Name=GPU Pack (Mesa lavapipe/llvmpipe)
Description=Faster software graphics for 64-bit NitroOS: Mesa lavapipe (multi-core software Vulkan 1.4, registered with the in-box Khronos Vulkan loader) and llvmpipe (LLVM-JIT OpenGL 4.6, a libgallium_wgl.dll that replaces the in-box OpenGL driver). Downloaded when turned on (about 134 MB, SHA-256 checked). Turning it off puts the in-box OpenGL driver back and unregisters the Vulkan driver. amd64 only.
Tier=os
; An optional, removable pack. Turning it off restores the in-box libgallium_wgl.dll (moved aside to .fmbak by
; the enable) and removes the lavapipe ICD registration and files.
Removable=1
Version=26.3.0
Group=Graphics
Dependencies=
; An image built with the GPU stack in system32 (CMake stages it at configure, dll/3rdparty/mesa3d/stage-amd64-llvm.sh;
; NitroOS release images are built that way) already has everything this pack installs: with this file present and no
; featmgr record the entry shows as Enabled, "included in this image", and cannot be turned off here.
BuiltInFile=%SystemRoot%\System32\vulkan_lvp.dll

; Hosted payload (engine.c, "hosted payloads"): the files are NOT in the image. Turning the pack on downloads each
; [Download] file over https from <BaseUrl>/<Path>/<file>, refuses it unless its SHA-256 matches, then applies
; [Payload] and [Registry]; the downloaded copies are deleted afterwards.
; BaseUrl below is the default. HKLM\SOFTWARE\ReactOS\Nitro\Featmgr, value PayloadBaseUrl (REG_SZ), overrides it
; (no trailing slash needed). A base that is not https:// (or that still holds a REPLACE-WITH- placeholder) makes the
; pack show as "not available yet", and turning it on is refused before anything changes.
; The hosted files (and how to upload them) are produced by tools/stage-lavapipe-payload.sh.
[Source]
BaseUrl=https://repo.nitroos.org/featmgr
Path=lavapipe-pack/26.3.0-dc2
; build-host source of the same files (private S3 cold tier, read by tools/stage-lavapipe-payload.sh only)
BuildArtifact=s3://reactos-nitro-archive/gfx01-lavapipe-amd64/26.3.0-dc2/gfx01-lavapipe-amd64-artifacts.tar.xz
BuildArtifactSHA256=39d5f70c56fef5b13adde8147b859e9af3c5b1a265bf0ac00066b275a4778831
SizeBytes=133999733
Arch=amd64
; This is the 26.3.0-dc2 pack (with the shader disk cache), the one images are built with (dll/3rdparty/mesa3d/stage-amd64-llvm.sh).
; engine.c refuses to turn the pack on (message "already newer, skipped", nothing changed) when a DLL named in GuardFiles in
; System32 or SysWOW64 is at least as new as PackFileTime, so an image that is built with this pack or a newer one keeps its
; files and an image with an older pack gets these. The Mesa DLLs carry no version resource, so a pack is identified by the
; last-write time of its files (the build's SOURCE_DATE_EPOCH 1763078400 = 2026-11-14 00:00:00 UTC for this one). GuardMinSize
; skips the in-tree softpipe-only libgallium_wgl.dll (18 MB). Bump PackFileTime together with Path/hashes when the hosted
; files are replaced by a newer pack.
PackFileTime=2026-11-14T00:00:00Z
GuardFiles=vulkan_lvp.dll,libgallium_wgl.dll
GuardMinSize=33554432
License=Mesa (lavapipe, llvmpipe): MIT; LLVM: Apache-2.0 WITH LLVM-exception (+ legacy LLVM/zlib/GCC-runtime notices); Vulkan-Loader (in-box vulkan-1.dll): Apache-2.0. Separate DLLs = aggregation; the three licence texts travel with the pack (System32\lavapipe-pack-licenses)

; File<N>=<file name>|<SHA-256>|<size in bytes>  (Mesa 26.3.0, LLVM 19.1.7, built by dll/3rdparty/mesa3d/build-mesa.sh)
[Download]
File0=vulkan_lvp.dll|48f9b4fa14fe709f64f1db9e3d687b80bc4b6b983274ee382372106d58f09a83|64841216
File1=lvp_icd.json|feb96dd7f1e2b183b080d215d6c676ce8e3a40925a01196e38cecddd4a29ec06|164
File2=libgallium_wgl.dll|22f5cad890d3069286882aa60bacf024afc13a7d71423409a626c6bfaf7c24dc|68715520
File3=llvm-licenses.txt|8d85c1057d742e597985c7d4e6320b015a9139385cff4cbae06ffc0ebe89afee|15141
File4=mesa3d-licenses.txt|170f2e90c9f06e59efd98e17ab43f0ee894e37c3636a39b1063ff4d2c3f8dfed|296471
File5=vulkan-loader-licenses.txt|b6600968e7f8738dff986221598ccb766556c6340ddce49dff3ff3d7ca177082|131221

[Payload]
File0=vulkan_lvp.dll|%SystemRoot%\System32\vulkan_lvp.dll
File1=lvp_icd.json|%SystemRoot%\System32\lvp_icd.json
File2=libgallium_wgl.dll|%SystemRoot%\System32\libgallium_wgl.dll
File3=llvm-licenses.txt|%SystemRoot%\System32\lavapipe-pack-licenses\llvm-licenses.txt
File4=mesa3d-licenses.txt|%SystemRoot%\System32\lavapipe-pack-licenses\mesa3d-licenses.txt
File5=vulkan-loader-licenses.txt|%SystemRoot%\System32\lavapipe-pack-licenses\vulkan-loader-licenses.txt

[Registry]
; Khronos loader: value NAME = absolute manifest path, data 0 = enabled (same as syssetup RegisterVulkanIcds)
Reg0=HKLM|SOFTWARE\Khronos\Vulkan\Drivers|%SystemRoot%\System32\lvp_icd.json|REG_DWORD|0
