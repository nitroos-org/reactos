File2=libgallium_wgl.dll|7fc352df8044a1c7dbdde79fd78be34f8a73842328d7a5ebbaf7bfb7eb63783a|68615168
File3=llvm-licenses.txt|8d85c1057d742e597985c7d4e6320b015a9139385cff4cbae06ffc0ebe89afee|15141
File4=mesa3d-licenses.txt|8176f74c4065731f80ca230308c633b961203af6c60a78a06c187fa244a76fab|290482
File5=vulkan-loader-licenses.txt|b6600968e7f8738dff986221598ccb766556c6340ddce49dff3ff3d7ca177082|131221

