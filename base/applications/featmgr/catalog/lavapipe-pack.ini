[Registry]
; Khronos loader: value NAME = absolute manifest path, data 0 = enabled (same as syssetup RegisterVulkanIcds)
Reg0=HKLM|SOFTWARE\Khronos\Vulkan\Drivers|%SystemRoot%\System32\lvp_icd.json|REG_DWORD|0
