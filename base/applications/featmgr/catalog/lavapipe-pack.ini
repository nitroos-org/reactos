[Feature]
Id=lavapipe-pack
Name=GPU Pack (Mesa lavapipe/llvmpipe)
Description=Faster software graphics for 64-bit NitroOS: Mesa lavapipe (multi-core software Vulkan 1.4, registered with the in-box Khronos Vulkan loader) and llvmpipe (LLVM-JIT OpenGL 4.6, a libgallium_wgl.dll that replaces the in-box OpenGL driver). Downloaded when turned on (about 129 MB, SHA-256 checked). Turning it off puts the in-box OpenGL driver back and unregisters the Vulkan driver. amd64 only.
Tier=os
; An optional, removable pack. Turning it off restores the in-box libgallium_wgl.dll (moved aside to .fmbak by
; the enable) and removes the lavapipe ICD registration and files.
Removable=1
Version=26.3.0
Group=Graphics
Dependencies=
; An image built with the GPU stack in system32 (CMake stages it at configure, dll/3rdparty/mesa3d/stage-amd64-llvm.sh;
; NitroOS release images are built that way) already has everything this pack installs: with this file present and no
; featmgr record the entry shows as Enabled, "included in this image", and cannot be turned off here.
BuiltInFile=%SystemRoot%\System32\vulkan_lvp.dll

; Hosted payload (engine.c, "hosted payloads"): the files are NOT in the image. Turning the pack on downloads each
; [Download] file over https from <BaseUrl>/<Path>/<file>, refuses it unless its SHA-256 matches, then applies
; [Payload] and [Registry]; the downloaded copies are deleted afterwards.
; BaseUrl below is the default. HKLM\SOFTWARE\ReactOS\Nitro\Featmgr, value PayloadBaseUrl (REG_SZ), overrides it
; (no trailing slash needed). A base that is not https:// (or that still holds a REPLACE-WITH- placeholder) makes the
; pack show as "not available yet", and turning it on is refused before anything changes.
; The hosted files (and how to upload them) are produced by tools/stage-lavapipe-payload.sh.
[Source]
BaseUrl=https://repo.nitroos.org/featmgr
Path=lavapipe-pack/26.3.0-beed97f8
; build-host source of the same files (private S3 cold tier, read by tools/stage-lavapipe-payload.sh only)
BuildArtifact=s3://reactos-nitro-archive/gfx01-lavapipe-amd64/26.3.0/gfx01-lavapipe-amd64-artifacts.tar.xz
BuildArtifactSHA256=beed97f838f2f7e3767fb528497bd35f3ee6d2443ef3a9d9eb197ea308cb3c60
SizeBytes=133814032
Arch=amd64
License=Mesa (lavapipe, llvmpipe): MIT; LLVM: Apache-2.0 WITH LLVM-exception (+ legacy LLVM/zlib/GCC-runtime notices); Vulkan-Loader (in-box vulkan-1.dll): Apache-2.0. Separate DLLs = aggregation; the three licence texts travel with the pack (System32\lavapipe-pack-licenses)

; File<N>=<file name>|<SHA-256>|<size in bytes>  (Mesa 26.3.0, LLVM 19.1.7, built by dll/3rdparty/mesa3d/build-mesa.sh)
