[Feature]
Id=dotnet-framework-4.8
Name=Microsoft .NET Framework 4.8
Description=Microsoft's .NET Framework 4.8 (the real CLR, not Mono): runs managed console, WinForms and WPF programs and compiles with csc/MSBuild. Install downloads the official offline installer from Microsoft (about 116 MB, SHA-256 checked) and runs it silently (/q /norestart); it takes a few minutes and about 1.5 GB of disk. The installer gets the Windows 7 SP1 answer from the compatibility database automatically, no layer to set. Turning it off runs the Framework's own uninstaller silently. i386 and amd64 (amd64 installs the 32-bit and the 64-bit Framework).
Tier=software
Version=4.8.4115
Group=Runtimes and frameworks
Dependencies=

[Install]
Provider=component
; The recipe (download address, SHA-256, size, detect rule, install and uninstall commands) is the [dotnet-framework-4.8]
; section of %SystemRoot%\Featmgr\Catalog\components.ini, shared with the first-boot installer. featmgr downloads the installer
; from Microsoft at install time, refuses it unless the SHA-256 matches, and never bundles it.
[Source]
Publisher=Microsoft Corporation
URLSite=https://dotnet.microsoft.com/download/dotnet-framework/net48
License=Proprietary (Microsoft). Not redistributed by ReactOS-Nitro: downloaded from Microsoft at install time; use is subject to Microsoft's license terms for the .NET Framework.
