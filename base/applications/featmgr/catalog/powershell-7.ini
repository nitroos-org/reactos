[Feature]
Id=powershell-7
Name=PowerShell 7 (LTS)
Description=Microsoft's cross-platform PowerShell (pwsh), 7.6 LTS. Installed at first boot (with Firefox and .NET Framework 4.8) when the network is up: Install downloads the official x64 MSI from the PowerShell release on GitHub (about 112 MiB, SHA-256 checked) and runs it silently: adds pwsh to the system PATH, the "Open PowerShell here" folder menu entry and the Start-menu shortcut; the desktop and Start menu then show PowerShell next to Command Prompt. PowerShell remoting and the Microsoft Update opt-in are left off. Turning it off runs the MSI's own uninstaller. amd64 only.
Tier=software
Version=7.6.9
Group=Developer tools
Dependencies=

[Install]
Provider=component
; The recipe (download address, SHA-256, size, detect rule, install and uninstall commands) is the [powershell-7] section of
; %SystemRoot%\Featmgr\Catalog\components.ini, shared with the first-boot installer. featmgr downloads the MSI at install time,
; refuses it unless the SHA-256 matches, and never bundles it in the image.
[Source]
Publisher=Microsoft Corporation
URLSite=https://github.com/PowerShell/PowerShell
License=MIT (PowerShell). Not redistributed by ReactOS-Nitro: the unmodified official x64 MSI is downloaded from the PowerShell release at install time.
