[Feature]
Id=powershell-7
Name=PowerShell 7 (LTS)
Description=Microsoft's cross-platform PowerShell (pwsh), 7.6 LTS. The default amd64 image installs it during setup from the MSI it carries; Install here repairs or reinstalls it: from that local MSI when present (works offline), else it downloads the official x64 MSI from the PowerShell GitHub release (about 112 MiB, SHA-256 checked); then runs it silently: adds pwsh to the system PATH and the Start-menu shortcut. PowerShell remoting, the Microsoft Update opt-in and Explorer context-menu entries are left off. amd64 only.
Tier=software
Version=7.6.9
Group=Developer tools
Dependencies=

[Install]
Provider=native
; Installed iff pwsh.exe exists: setup installs the MSI itself, so the entry is detected, not only recorded.
DetectPath=%ProgramFiles%\PowerShell\7\pwsh.exe

[Rapps]
; Local-first: when this MSI is in the feature's payload folder (%SystemRoot%\Featmgr\Payload\powershell-7, put there by the
; image under this name) and its SHA-256 matches [Source] ArtifactSHA256, install runs msiexec on it with the MsiProperties below
; and never touches the network; otherwise featmgr downloads the release MSI ([Source]) and checks that same SHA-256.
LocalInstaller=PowerShell-x64.msi
; UninstallName: the MSI's ProductName (Add/Remove Programs name); featmgr finds the installed product by it and runs
; "msiexec /x{ProductCode} /qn", so uninstall needs no stored product code and keeps working across a version bump.
UninstallName=PowerShell 7-x64
; Public properties of the official MSI, appended to "msiexec /i <msi> /qn /norestart":
;   PWRSHPLUGIN_VERSION=1  waive the launch condition "WMF 4+ (System32\pwrshplugin.dll) required";
;                          that file is the WinRM remoting plugin, which nitro has no use for
;   ADD_PATH=1             add the install folder to the system PATH
;   ENABLE_PSREMOTING=0    do not enable PowerShell remoting (nitro has no WinRM)
;   REGISTER_MANIFEST=0    do not register the ETW/event manifest (wevtutil)
;   USE_MU=0 ENABLE_MU=0   no Microsoft Update opt-in
;   ADD_EXPLORER_CONTEXT_MENU_OPENPOWERSHELL=0 ADD_FILE_CONTEXT_MENU_RUNPOWERSHELL=0  no shell verbs
; The Start-menu shortcut "PowerShell 7 (x64)" is unconditional in the MSI.
MsiProperties=PWRSHPLUGIN_VERSION=1 ADD_PATH=1 ENABLE_PSREMOTING=0 REGISTER_MANIFEST=0 USE_MU=0 ENABLE_MU=0 ADD_EXPLORER_CONTEXT_MENU_OPENPOWERSHELL=0 ADD_FILE_CONTEXT_MENU_RUNPOWERSHELL=0

; Why the MSI is run with PWRSHPLUGIN_VERSION=1 (see the MsiProperties line in powershell-7.txt):
; the stock MSI has a launch condition that looks for %WINDIR%\System32\pwrshplugin.dll (the WSMan
; remoting plugin from WMF 4+). Current images ship a stub pwrshplugin.dll that satisfies it (every entry
; point fails, so remoting is not pretended), and the stock MSI installs without the property. The
; property stays so that this entry also works on images that predate the stub; it only waives a
; prerequisite that matters for PowerShell remoting, which is also kept off (ENABLE_PSREMOTING=0).
; No WSMan plugin is registered and no PowerShellEngine registry key is written.


; The MSI is not in git. amd64 images built with the preinstall (stage-powershell7.sh, pinned URL + SHA-256) carry it
; and syssetup installs it through "featmgr /enable powershell-7"; an image without it downloads it from the PowerShell
; release on GitHub at install time (featmgr verifies the SHA-256 below before running it).
; Version bump (manual, no auto-discovery): take the new 7.6.x LTS from
; https://github.com/PowerShell/PowerShell/releases (asset hashes.sha256, or the asset's digest) and change,
; here: Version=, Artifact= (URL carries the version), ArtifactSHA256=, SizeBytes=; in
; Catalog\components.ini [powershell-7]: Url, Sha256, SizeBytes, FileName, the Uninstall ProductCode; and in
; payload\powershell-7\stage-powershell7.sh: VERSION, SHA256 and the
; LICENSE.txt / ThirdPartyNotices.txt of the tag. Keep all of them identical; then re-run the featmgr live install test.
[Source]
Artifact=https://github.com/PowerShell/PowerShell/releases/download/v7.6.9/PowerShell-7.6.9-win-x64.msi
ArtifactSHA256=50d33c7494aaf82b987cfd4de3f232d04f91fdd4c0deeca8a669cced3e7cf8f9
SizeBytes=117493760
Arch=amd64
Publisher=Microsoft Corporation
URLSite=https://github.com/PowerShell/PowerShell
License=MIT (PowerShell); LICENSE.txt and ThirdPartyNotices.txt of the release ship with the bundled MSI (Featmgr\Payload\powershell-7). The MSI is the unmodified official x64 package.
