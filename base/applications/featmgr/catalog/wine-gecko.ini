[Feature]
Id=wine-gecko
Name=Wine Gecko 2.40 (HTML engine for Internet Explorer components)
Description=Gecko HTML engine for mshtml (WebBrowser controls, help viewers, installers). Compatibility only: a 2017-era Gecko 2.40, not for browsing untrusted sites (use Firefox). Downloads the official Wine Gecko 2.40 packages (32-bit, and on 64-bit NitroOS also 64-bit; about 60 MB, SHA-256 checked), same sources as the appwiz add-on prompt. MPL 2.0.
Tier=software
Version=2.40
Group=Runtimes and frameworks
Dependencies=

[Install]
Provider=component
; The recipe is the [wine-gecko] section (32-bit package; Also= the [wine-gecko-x64] section on 64-bit NitroOS) of
; %SystemRoot%\Featmgr\Catalog\components.ini. featmgr downloads each package at install time, refuses it unless the SHA-256
; (and SHA-1) match, and never bundles it. Installed = the engine's xul.dll is in gecko\2.40\wine_gecko of System32 (and of SysWOW64).
[Source]
Publisher=The Wine Project (Wine Gecko, built from Mozilla Gecko)
URLSite=https://wiki.winehq.org/Gecko
License=MPL-2.0 (Mozilla Gecko; the package's LICENSE points to its about:license page: MPL 2.0, LGPL 2.1/3.0 and third-party licenses). Not redistributed by ReactOS-Nitro: downloaded at install time. Compatibility-only 2017-era engine; re-evaluate when a newer Gecko build is available (upstream ReactOS PR 9550).
