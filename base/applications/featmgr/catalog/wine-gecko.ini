[Feature]
Id=wine-gecko
Name=Wine Gecko 2.47.4 (HTML engine for Internet Explorer components)
Description=Gecko HTML engine for mshtml (WebBrowser controls, help viewers, installers). Compatibility only: an old Gecko engine (the one Wine 10's mshtml asks for, 2.47.4), not for browsing untrusted sites (use Firefox). Downloads the official Wine Gecko 2.47.4 packages (32-bit, and on 64-bit NitroOS also 64-bit; about 55 MB each, SHA-256 checked), same sources as the appwiz add-on prompt. MPL 2.0.
Tier=software
Version=2.40
Group=Runtimes and frameworks
Dependencies=

[Install]
Provider=component
; The recipe is the [wine-gecko] section (32-bit package; Also= the [wine-gecko-x64] section on 64-bit NitroOS) of
; %SystemRoot%\Featmgr\Catalog\components.ini. featmgr downloads each package at install time, refuses it unless the SHA-256
; (and SHA-1) match, and never bundles it. Installed = the engine's xul.dll is in gecko\2.47.4\wine_gecko of System32 (and of SysWOW64).
[Source]
Publisher=The Wine Project (Wine Gecko, built from Mozilla Gecko)
URLSite=https://wiki.winehq.org/Gecko
License=MPL-2.0 (Mozilla Gecko; the package's LICENSE points to its about:license page: MPL 2.0, LGPL 2.1/3.0 and third-party licenses). Not redistributed by ReactOS-Nitro: downloaded at install time. Compatibility-only engine; mshtml (synced to Wine 10.0) accepts exactly Gecko 2.47.4, and WineHQ has published nothing newer.
