[Feature]
Id=powershell-7
Name=PowerShell 7 (LTS)
Description=Microsoft's cross-platform PowerShell (pwsh), 7.6 LTS, the 32-bit (x86) build. Not part of the i386 image: Install downloads the official x86 MSI from the PowerShell GitHub release (about 105 MiB, SHA-256 checked) and runs it silently: adds pwsh to the system PATH and the Start-menu shortcut. PowerShell remoting, the Microsoft Update opt-in and Explorer context-menu entries are left off. x86 only (the amd64 image has its own entry).
Tier=software
Version=7.6.8
Group=Developer tools
Dependencies=

[Install]
Provider=native
; Installed iff pwsh.exe exists (the 32-bit MSI installs to %ProgramFiles%\PowerShell\7 on a 32-bit system, as the x64 one does on amd64).
DetectPath=%ProgramFiles%\PowerShell\7\pwsh.exe

[Rapps]
; UninstallName: the MSI's ProductName (Add/Remove Programs name); featmgr finds the installed product by it and runs
; "msiexec /x{ProductCode} /qn", so uninstall needs no stored product code and keeps working across a version bump.
UninstallName=PowerShell 7-x86
; Public properties of the official MSI, appended to "msiexec /i <msi> /qn /norestart", the same as on amd64 (see the
; amd64 entry for what each one does): PWRSHPLUGIN_VERSION=1 waives the WinRM plugin launch condition, ADD_PATH=1 adds the
; install folder to the system PATH, and remoting, the event manifest, Microsoft Update and the Explorer verbs stay off.
; The Start-menu shortcut "PowerShell 7 (x86)" is unconditional in the MSI.
MsiProperties=PWRSHPLUGIN_VERSION=1 ADD_PATH=1 ENABLE_PSREMOTING=0 REGISTER_MANIFEST=0 USE_MU=0 ENABLE_MU=0 ADD_EXPLORER_CONTEXT_MENU_OPENPOWERSHELL=0 ADD_FILE_CONTEXT_MENU_RUNPOWERSHELL=0

; The MSI is not in git and not in the i386 image (no LocalInstaller): featmgr downloads it from the release below and checks the SHA-256.
; The pin is 7.6.8, the newest release whose x86 MSI downloads correctly (the x86 MSIs of 7.6.9 and 7.6.10 were served as a small
; block list instead of the package when this entry was written, 2026-11-21: check before moving to a newer one). The SHA-256 is
; the value in that release's hashes.sha256.
; Version bump (manual): the same places as for amd64 but for the x86 file: here Version=, Artifact=, ArtifactSHA256=, SizeBytes=;
; in Catalog\components.ini [powershell-7]: Url.x86, Sha256.x86, SizeBytes.x86, FileName.x86 and the Uninstall.x86 ProductCode.
[Source]
Artifact=https://github.com/PowerShell/PowerShell/releases/download/v7.6.8/PowerShell-7.6.8-win-x86.msi
ArtifactSHA256=b07c708f79ceff374f29f25010f4c51c0c6225c1c9f02175784e11574b6dff8a
SizeBytes=110415872
Arch=x86
Publisher=Microsoft Corporation
URLSite=https://github.com/PowerShell/PowerShell
License=MIT (PowerShell). Not redistributed by ReactOS-Nitro: the unmodified official x86 MSI is downloaded from the PowerShell GitHub release at install time.
