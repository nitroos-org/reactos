[Feature]
Id=nitro-rdp
Name=Remote Desktop server (RDP)
Description=Lets another computer see and control the screen of the signed-in session over the Remote Desktop protocol: Administrators only, network level authentication required, one client at a time. Installs a service that is stopped and disabled, a per-session helper and a firewall rule for TCP 3389 that is created disabled: nothing listens until an administrator runs "nrdpctl on". amd64 only; downloaded when turned on (about 7 MB, SHA-256 checked). Licences: see the Notice.
Tier=os
; An optional, removable add-on, NOT in the image and OFF by default. The package is built OUTSIDE this tree (FreeRDP, OpenSSL and zlib are not
; imported into it); this file is the catalog entry. The package build writes the same entry with the real [Source] and [Download] values
; (pkg: out/nitro-rdp.ini): until then the placeholders below make the entry "not available yet" and Enable refuses.
Removable=1
Version=1.0
Group=Network
Dependencies=
Notice=This add-on installs a Remote Desktop (RDP) server. It is OFF until an administrator runs "nrdpctl on".\n\nWhen on, only Administrators can connect (a standard user is refused even with the right password) and they see and control the console session; if another user is signed in at the console the connection is refused unless "nrdpctl shadow on" allows it (default off).\n\nFor machines whose local users are all trusted (registry access control is not enforced yet). Lockout is off unless set: use strong passwords. A Windows client warns about the self-signed certificate: compare its fingerprint with "nrdpctl status".\n\nLicences: FreeRDP, OpenSSL, Nitro RDP Apache-2.0; zlib licence (%ProgramFiles%\NitroRdp\NOTICE.txt). No client access licences are checked.

[Source]
BaseUrl=https://repo.nitroos.org/featmgr
Path=nitro-rdp/1.0
SizeBytes=6948834
Arch=amd64
HideOnOtherArch=1
License=Apache-2.0 for the Nitro RDP glue, FreeRDP 3.33.1 and OpenSSL 3.5.9; zlib 1.3.1 under the zlib licence; all statically linked; full texts in NOTICE.txt (installed) and in the package source offer

