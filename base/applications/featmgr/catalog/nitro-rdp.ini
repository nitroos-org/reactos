[Payload]
File0=nrdpsvc.exe|%ProgramFiles%\NitroRdp\nrdpsvc.exe
File1=nrdpagent.exe|%ProgramFiles%\NitroRdp\nrdpagent.exe
File2=nrdpctl.exe|%ProgramFiles%\NitroRdp\nrdpctl.exe
File3=NOTICE.txt|%ProgramFiles%\NitroRdp\NOTICE.txt
File4=LICENSE.txt|%ProgramFiles%\NitroRdp\LICENSE.txt
File5=README.txt|%ProgramFiles%\NitroRdp\README.txt

; The helper of the signed-in session: started for every user at sign-in (it does nothing until the service asks).
[Registry]
Reg0=HKLM|SOFTWARE\Microsoft\Windows\CurrentVersion\Run|NitroRdpAgent|REG_SZ|"%ProgramFiles%\NitroRdp\nrdpagent.exe"

; Name|Type|StartType|ImagePath|DisplayName|Run|Account. Disabled, NOT started (nobody can start it until "nrdpctl on" makes it
; automatic), runs as its own virtual account (not LocalSystem).
[Service]
Svc0=NitroRdp|win32|disabled|"%ProgramFiles%\NitroRdp\nrdpsvc.exe"|Nitro Remote Desktop|0|NT SERVICE\NitroRdp

; nrdpctl setup: the service's data directory (certificate, key, log) with an access list for SYSTEM, Administrators and the service
; account only, the service's privilege list, and the firewall rule for TCP 3389 for the service program, created disabled.
; teardown: stop, delete rule and directory.
[Hooks]
Enable="%ProgramFiles%\NitroRdp\nrdpctl.exe" setup
Disable="%ProgramFiles%\NitroRdp\nrdpctl.exe" teardown
