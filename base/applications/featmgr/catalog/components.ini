; NitroOS component list: the one data file for components that featmgr downloads and installs itself
; (Provider=component in the catalog entry of the same Id) and that the first-boot installer
; (optfeatures /firstboot) installs by default. Read by components.c; nothing from Microsoft is in the image:
; every file is downloaded at install time from the address below and refused unless its SHA-256 matches.
;
; Keys (one [section] per component, section name = catalog Id):
;   Name         display name
;   Url          https download address (required)
;   Sha256       SHA-256 of the file, 64 hex digits (required; no checksum = no download)
;   SizeBytes    size in bytes (progress total, disk-space check)
;   FileName     name of the file in %SystemRoot%\Featmgr\Downloads
;   Arch         x86, amd64 or both (this build's architecture must be listed)
;   Default      1 = the first-boot installer installs it when it is not installed
;   DetectReg    HKLM\key|value|>=N   installed when the DWORD is >= N ("|=N" equal; no third field = the value exists)
;   DetectFile   installed when this file exists (%vars% expanded)
;   Install      command line; %FILE% = the verified download (quoted by featmgr). Exit codes 0, 3010 and 1641 are success
;   Uninstall    command line that removes it (Uninstall.amd64 / Uninstall.x86 win for that build); recorded at install
;   Sha1         optional SHA-1, checked in addition to the SHA-256 (the pin of another source of the same file)
;   Cleanup      (with Also) command run last when every package's Uninstall worked (one leading '?' marks it in the recorded list)
;   Also         the id of another section that belongs to this component (a second package): installed after this one when its
;                Arch= lists this build, skipped when its own detect rule already holds; detected as a whole; a failure of the later
;                package takes the earlier one out again; Uninstall lines of all packages are recorded together (Wine Gecko: 32-bit + 64-bit)
;   Install / DetectReg / DetectFile also take a .amd64 or .x86 suffix that wins for that build (as Uninstall does)
;
; Order = install order at first boot: the quick ones first, the big .NET installer last (a failure of one never stops the others).
; Version bump (manual, no auto-discovery): take the new installer from the vendor's download page and change
; Url, Sha256 (sha256sum of the file), SizeBytes and the Uninstall ProductCode here, and Version= in the catalog entry; then re-run the live test.

[powershell-7]
Name=PowerShell 7 (LTS)
Arch=amd64
Default=1
; the official x64 MSI of the PowerShell 7.6 LTS release on GitHub (the unmodified package). The ISO preinstalls this same MSI
; at setup (payload/powershell-7), so first boot detects it (DetectFile) and skips the download; this recipe only matters when
; pwsh is missing (an image built without the preinstall, or removed by hand).
Url=https://github.com/PowerShell/PowerShell/releases/download/v7.6.9/PowerShell-7.6.9-win-x64.msi
Sha256=50d33c7494aaf82b987cfd4de3f232d04f91fdd4c0deeca8a669cced3e7cf8f9
SizeBytes=117493760
FileName=PowerShell-7.6.9-win-x64.msi
DetectFile=%ProgramFiles%\PowerShell\7\pwsh.exe
; PWRSHPLUGIN_VERSION=1 waives the launch condition for the WinRM plugin (pwrshplugin.dll, remoting; nitro has no WinRM).
; Added to the system PATH; remoting, the event manifest and the Microsoft Update opt-in stay off. "Open PowerShell here"
; is on (Explorer folder context menu, as on Windows); the "Run with PowerShell" file verb stays off.
Install=msiexec.exe /i %FILE% /qn /norestart PWRSHPLUGIN_VERSION=1 ADD_PATH=1 ENABLE_PSREMOTING=0 REGISTER_MANIFEST=0 USE_MU=0 ENABLE_MU=0 ADD_EXPLORER_CONTEXT_MENU_OPENPOWERSHELL=1 ADD_FILE_CONTEXT_MENU_RUNPOWERSHELL=0
; ProductCode of this MSI (msiinfo export PowerShell-7.6.9-win-x64.msi Property). A version bump changes it: update it with Url.
Uninstall=msiexec.exe /x {5417B253-1A6D-4638-BC94-743A6EC2E6F4} /qn /norestart

[firefox]
Name=Mozilla Firefox
Arch=amd64
Default=1
; the official x64 MSI of the current Firefox release from Mozilla's release archive, unmodified and not bundled in the image.
; The SHA-256 is the one in the release's signed SHA256SUMS file (archive.mozilla.org/pub/firefox/releases/<version>/SHA256SUMS).
Url=https://archive.mozilla.org/pub/firefox/releases/159.0.1/win64/en-US/Firefox%20Setup%20159.0.1.msi
Sha256=5e9e344fcf409d07351c20814b17214d59c39e3669142b8b7267556bb394577b
SizeBytes=94740480
FileName=Firefox-Setup-159.0.1.msi
DetectFile=%ProgramFiles%\Mozilla Firefox\firefox.exe
; Mozilla's documented MSI properties: no maintenance service (it is only for silent background updates) and no
; default-browser agent scheduled task; the shortcuts stay at their defaults (all-users Desktop and Start menu).
; featmgr then adds distribution\policies.json (no default-browser nag, no first-run pages) and makes Firefox the
; default browser (shelldefaults.c).
Install=msiexec.exe /i %FILE% /qn /norestart INSTALL_MAINTENANCE_SERVICE=false REGISTER_DEFAULT_AGENT=false
; Mozilla's own silent uninstaller (documented: uninstall\helper.exe /S). The MSI does not register a Windows Installer product on
; this system (msiexec /x {ProductCode} answers 1605), and the helper is what Add/Remove Programs runs on Windows too.
Uninstall="%ProgramFiles%\Mozilla Firefox\uninstall\helper.exe" /S

[dotnet-framework-4.8]
Name=Microsoft .NET Framework 4.8
Arch=x86,amd64
Default=1
; the offline installer (x86 and x64 in one file) behind the "offline installer" link of the .NET 4.8 download page
; (go.microsoft.com/fwlink/?linkid=2088631 redirects to this file)
Url=https://download.microsoft.com/download/f/3/a/f3a6af84-da23-40a5-8d1c-49cc10c8e76f/NDP48-x86-x64-AllOS-ENU.exe
Sha256=0a3a390c47e639d0f7fc65b21195fee6b7f65b066f80f70c60fab191d14b7e40
SizeBytes=121346568
FileName=NDP48-x86-x64-AllOS-ENU.exe
; Release >= 528040 is .NET Framework 4.8 or later (Microsoft's documented detection value)
DetectReg=HKLM\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full|Release|>=528040
; /q = no UI, /norestart = never restart by itself (3010 is reported to the window, which offers "Restart now").
; Nothing else is passed: no language packs, no web download. The installer needs the Windows 7 SP1 answer; the application
; compatibility database (media\sdb\sysmain.xml) gives it to the installer and to the Setup.exe it starts.
Install=%FILE% /q /norestart
; The Framework's own Setup.exe from its SetupCache\v4.8.03761 folder (under Framework on i386, under Framework64 on amd64).
; On amd64 it needs the WoW64 registry view fix of a relative open from a KEY_WOW64_64KEY handle (MsiGetPatchInfoEx finds
; the .NET 4.8 update, KB4503575, only if the 32-bit Setup.exe could register it in the 64-bit view).
; A later 4.8.x installer that changes the SetupCache folder name or the MSI product code needs these lines changed too.
Uninstall.x86=%SystemRoot%\Microsoft.NET\Framework\v4.0.30319\SetupCache\v4.8.03761\Setup.exe /uninstall /x86 /x64 /q /norestart
Uninstall.amd64=%SystemRoot%\Microsoft.NET\Framework64\v4.0.30319\SetupCache\v4.8.03761\Setup.exe /uninstall /x86 /x64 /q /norestart

[wine-gecko]
Name=Wine Gecko 2.40 (32-bit)
Arch=x86,amd64
; Wine Gecko 2.40 for mshtml (compatibility only; MPL 2.0, third-party licenses in the package's about:license). Two packages: this 32-bit
; one (on 64-bit NitroOS it goes into SysWOW64 through the 32-bit msiexec) and, there, the 64-bit one of [wine-gecko-x64] (Also=).
; The sources and checksums are those of the add-on prompt of appwiz.cpl (dll\cpl\appwiz\addons.c, SHA-1; tools\check-gecko-pins.sh
; compares them): the ReactOS-hosted 32-bit build, not WineHQ's own wine_gecko-2.40-x86.msi (a different build, SHA-1 7001a6ed...).
Url=https://svn.reactos.org/amine/wine_gecko-2.40-x86.msi
Sha256=3cc26670b7f212dc8f3db92b26796df411aeff6892ef081bc461ebbff12fc02c
Sha1=8a3adedf3707973d1ed4ac3b2e791486abf814bd
SizeBytes=27959808
FileName=wine_gecko-2.40-x86.msi
; mshtml looks the engine up in HKLM\Software\Wine\MSHTML\2.40 (GeckoPath), which the package writes (the 32-bit one in the 32-bit
; view); the files are the same test, whoever installed it (this list or appwiz's prompt)
DetectFile.x86=%SystemRoot%\system32\gecko\2.40\wine_gecko\xul.dll
DetectFile.amd64=%SystemRoot%\SysWOW64\gecko\2.40\wine_gecko\xul.dll
Install.x86=msiexec.exe /i %FILE% /qn /norestart
Install.amd64=%SystemRoot%\SysWOW64\msiexec.exe /i %FILE% /qn /norestart
; ProductCode of the package (msiinfo export wine_gecko-2.40-x86.msi Property)
Uninstall.x86=msiexec.exe /x {43E91AE4-1065-4255-B035-3035D5287CF8} /qn /norestart
Uninstall.amd64=%SystemRoot%\SysWOW64\msiexec.exe /x {43E91AE4-1065-4255-B035-3035D5287CF8} /qn /norestart
Also=wine-gecko-x64
; The two MSIs register one component (the same ComponentId in both), so removing both products leaves the files of one of them
; behind (ReactOS's Windows Installer keeps a shared component's files for the other client): the cleanup, run last and only
; after both msiexec /x worked, removes the engine's folders and the 32-bit view's GeckoPath key (it stays too). Rolled into the uninstall line list, also for an install that
; appwiz.cpl's prompt did.
Cleanup.amd64=cmd.exe /c rd /s /q "%SystemRoot%\SysWOW64\gecko\2.40" 2>nul & rd /s /q "%SystemRoot%\System32\gecko\2.40" 2>nul & rd "%SystemRoot%\SysWOW64\gecko" 2>nul & rd "%SystemRoot%\System32\gecko" 2>nul & "%SystemRoot%\SysWOW64\reg.exe" delete HKLM\Software\Wine\MSHTML\2.40 /f 2>nul & exit 0

[wine-gecko-x64]
Name=Wine Gecko 2.40 (64-bit)
Arch=amd64
; official 64-bit package from WineHQ (the SHA-1 is the one in appwiz's addons.c)
Url=https://dl.winehq.org/wine/wine-gecko/2.40/wine_gecko-2.40-x86_64.msi
Sha256=c3e28988e7d92221596fc4c569d10eb4dd2ca64b9f4970bf77e791f5dd8c9230
Sha1=356c414527b08b015b6dc53dbbf78d752320ae90
SizeBytes=33056768
FileName=wine_gecko-2.40-x86_64.msi
DetectFile=%SystemRoot%\system32\gecko\2.40\wine_gecko\xul.dll
Install=msiexec.exe /i %FILE% /qn /norestart
Uninstall=msiexec.exe /x {D8E96C36-6341-4766-B82C-DFEB7AE0406D} /qn /norestart
