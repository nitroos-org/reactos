[Feature]
Id=openssh-client
Name=OpenSSH Client
Description=The SSH client programs: ssh, scp, sftp, ssh-keygen, ssh-add, ssh-agent and ssh-keyscan, from the official Win32-OpenSSH release 10.4.0.0p1 on GitHub. Install downloads the archive for this system (about 5.7 MiB on 64-bit, 5.0 MiB on 32-bit; SHA-256 checked), puts the client programs in System32\OpenSSH and adds that folder to the system PATH, so ssh works from any Command Prompt or PowerShell window opened afterwards. Turning it off removes exactly those files and the PATH entry. The ssh-agent background service is not registered (start ssh-agent by hand or register it yourself); the SSH server (sshd) is not part of this entry.
Tier=software
Version=10.4.0.0
Group=Internet
Dependencies=

[Install]
Provider=component
; The recipe is the [openssh-client] section of %SystemRoot%\Featmgr\Catalog\components.ini: featmgr downloads the zip from the
; PowerShell/Win32-OpenSSH release on GitHub, refuses it unless the SHA-256 matches, unpacks only the client files
; (featmgr /zip-install) and puts the folder on the machine PATH. Setup does not install it and first boot does not request it.

[Source]
Publisher=PowerShell/Win32-OpenSSH (Microsoft), based on OpenSSH from the OpenBSD project
URLSite=https://github.com/PowerShell/Win32-OpenSSH
License=BSD-style (the OpenSSH licence: BSD / ISC / public domain parts, no GPL code; LICENSE.txt and NOTICE.txt of the release are installed next to the programs). Not redistributed by ReactOS-Nitro: the unmodified official archive is downloaded at install time.
