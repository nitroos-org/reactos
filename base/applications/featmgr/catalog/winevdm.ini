[Feature]
Id=winevdm
Name=WineVDM (16-bit Windows application support)
Description=Also known as OTVDM. Enables support for 16-bit Windows (WOW16) applications on 32-bit NitroOS. Downloads the official WineVDM 0.8.1 installer (about 3 MB, SHA-256 and SHA-1 checked) and runs it silently; it installs in the Program Files folder. GPL. i386 only.
Tier=software
Version=0.8.1
Group=Runtimes and frameworks
Dependencies=

[Install]
Provider=component
; The recipe is the [winevdm] section of %SystemRoot%\Featmgr\Catalog\components.ini: featmgr downloads the installer at install time,
; refuses it unless the SHA-256 (and the SHA-1 of the RAPPS entry it replaces) match, and never bundles it. Setup does not install or
; request it: this entry is the on-demand route.

[Source]
Publisher=otya128 (WineVDM / OTVDM), installer by peterooch
URLSite=https://github.com/otya128/winevdm
License=GPL (WineVDM). Not redistributed by ReactOS-Nitro: downloaded at install time.
